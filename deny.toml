# cargo-deny configuration.
# Install: `cargo install cargo-deny`
# Run:     `cargo deny check`

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Licenses we accept in our dependency tree.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
