name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run_tag:
        description: |
          Synthetic tag to embed in archive filenames during a manual
          dry-run (e.g. v0.1.0-rc1). The dispatched run never publishes
          a release — archives are uploaded as workflow artifacts.
        required: false
        default: v0.0.0-dryrun

# GitHub can occasionally deliver the same tag push more than once. Keep only
# the newest run for a ref so duplicate matrix jobs cannot race while uploading
# identically named release assets or updating the Homebrew tap.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Create the GitHub Release once, before any matrix build runs. The
  # taiki-e/upload-rust-binary-action only uploads — it doesn't create
  # the release container — so without this prelude every matrix leg
  # races on a non-existent release and bails with "release not found".
  # Skipped on workflow_dispatch (which is dry-run mode).
  create-release:
    name: create release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # A tag whose binaries report a different version, or whose notes were
      # never cut, is worth catching here rather than after four builds have
      # run and a draft is sitting in the releases page.
      - name: Verify the tag matches the tree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          crate="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          if [ "$crate" != "$version" ]; then
            echo "::error::tag $tag does not match the workspace version $crate — bump Cargo.toml or retag" >&2
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section — cut it before tagging" >&2
            exit 1
          fi

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Idempotent: if a previous run already created it, skip.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; reusing"
            exit 0
          fi
          gh release create "$tag" \
            --title "$tag" \
            --draft \
            --notes "Release notes are populated from CHANGELOG.md after the matrix uploads finish."

  build:
    name: build ${{ matrix.target }}
    needs: [create-release]
    # Run on workflow_dispatch (dry-run, where create-release is skipped)
    # AND on tag push (where create-release must succeed first).
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.create-release.result == 'success') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Resolve the version-ish ref that goes into archive filenames.
      # - tag push: GITHUB_REF_NAME (e.g. "v0.1.0")
      # - workflow_dispatch: the user-supplied dry_run_tag input
      - name: Resolve ref name
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ref="${{ inputs.dry_run_tag }}"
          else
            ref="${GITHUB_REF_NAME}"
          fi
          echo "name=${ref}" >> "$GITHUB_OUTPUT"

      - name: Build, package, and (on tag) upload to release
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          # Two binaries from the workspace.
          bin: muxa,muxad
          target: ${{ matrix.target }}
          # Archive filename pattern: muxa-v0.1.0-x86_64-unknown-linux-gnu.tar.gz
          archive: muxa-${{ steps.ref.outputs.name }}-${{ matrix.target }}
          # Bundle license, README, and example wiring next to the binaries.
          # Note: the action also auto-includes top-level LICENSE* and
          # README.md, but listing them here keeps intent explicit.
          include: >-
            LICENSE-MIT,LICENSE-APACHE,README.md,examples/muxad.service,examples/muxa.tmux.conf,examples/claude-settings.json
          # Files inside the archive sit under a directory named after
          # the archive (matches `tar tf` UX of common Rust releases).
          leading-dir: true
          # Emit SHA256SUMS-style sidecar per archive.
          checksum: sha256
          # workflow_dispatch path skips the gh release upload — we
          # capture the archive ourselves below as a workflow artifact.
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
          # Used for the gh release upload on tag push.
          token: ${{ secrets.GITHUB_TOKEN }}

      # Dry-run path: surface the built archive + checksum as a workflow
      # artifact so it can be downloaded and inspected without cutting
      # an actual GitHub Release.
      # (see the `publish` job below for what happens after the matrix)
      - name: Upload archive as workflow artifact (dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: muxa-${{ steps.ref.outputs.name }}-${{ matrix.target }}
          path: |
            muxa-${{ steps.ref.outputs.name }}-${{ matrix.target }}.tar.gz
            muxa-${{ steps.ref.outputs.name }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  # The Mac app ships as a notarized DMG rather than through the App Store:
  # Muxa runs the operator's own binaries, talks to a daemon that outlives it
  # over a socket in /tmp, and reads whatever directory the work is in. The
  # App Sandbox forbids all three, so Developer ID is the only route.
  #
  # Without signing secrets this still builds and uploads a workflow artifact,
  # so a fork — or this repo before the certificate existed — gets a green run
  # instead of a failure. What it will not do is attach an unsigned DMG to a
  # release, because a DMG Gatekeeper refuses is worse than no DMG at all.
  macos-app:
    name: macOS app
    needs: [create-release]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.create-release.result == 'success') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Resolve ref name
        id: ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ref="${{ inputs.dry_run_tag }}"
          else
            ref="${GITHUB_REF_NAME}"
          fi
          echo "name=${ref}" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install xcodegen
        run: brew install xcodegen

      # libghostty is cloned, patched and built from pinned commits; that is
      # minutes of Zig on a cold runner and unchanged between most releases.
      - name: Cache libghostty
        uses: actions/cache@v4
        with:
          path: |
            apps/muxa-macos/.build/dependencies
            apps/muxa-macos/.build/toolchains
            apps/muxa-macos/.build/libghostty.stamp
          key: libghostty-${{ runner.os }}-${{ hashFiles('apps/muxa-macos/Dependencies.lock', 'apps/muxa-macos/Patches/libghostty-spm/*.patch') }}

      # A keychain of its own, unlocked only for this job and deleted after it,
      # so the certificate never touches the runner's login keychain.
      - name: Import the Developer ID certificate
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ]; then
            echo "::warning::MACOS_CERT_P12 is not set — building an unsigned DMG"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/muxa-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -A
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign blocks on a UI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)".*/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "::error::the p12 holds no Developer ID Application identity" >&2
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "::notice::signing as $identity"

      - name: Stage the notarization key
        id: notary
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${NOTARY_KEY:-}" ] || [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            echo "::warning::no notarization credentials — the DMG will not be notarized"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "path=$key" >> "$GITHUB_OUTPUT"

      - name: Build, sign, notarize and package
        env:
          MUXA_VERSION: ${{ steps.ref.outputs.version }}
          MUXA_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          MUXA_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          MUXA_SKIP_NOTARIZE: ${{ steps.notary.outputs.enabled == 'true' && '0' || '1' }}
          NOTARY_KEY_PATH: ${{ steps.notary.outputs.path }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: apps/muxa-macos/Scripts/package-dmg.sh

      - name: Checksum
        id: dmg
        run: |
          set -euo pipefail
          dmg=$(/bin/ls apps/muxa-macos/dist/*.dmg | head -1)
          name=$(basename "$dmg")
          # Same "<sha256>  <file>" shape the Rust archives publish, so the
          # tap bump can read every sidecar the same way.
          (cd "$(dirname "$dmg")" && shasum -a 256 "$name" > "$name.sha256")
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attach the DMG to the release
        if: github.event_name == 'push' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.dmg.outputs.path }}" "${{ steps.dmg.outputs.path }}.sha256" --clobber

      - name: Upload the DMG as a workflow artifact
        if: github.event_name == 'workflow_dispatch' || steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Muxa-${{ steps.ref.outputs.name }}-dmg
          path: apps/muxa-macos/dist/*.dmg*
          if-no-files-found: error
          retention-days: 14

      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: |
          security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
          rm -f "$RUNNER_TEMP/notary.p8"

  # Flip the draft once — and only once — every archive is attached.
  #
  # Ordering is the whole point. `tap-bump` fires on `release: published`, and
  # a release published before its assets exist hands the Homebrew formula
  # download URLs that 404 (v0.8.27 shipped that way and the bump died with
  # "no assets to download"). `needs: [build]` is what keeps that from
  # happening: with `fail-fast: false`, one broken target leaves the release a
  # draft for a human to look at instead of publishing a partial set.
  publish:
    name: publish release
    needs: [create-release, build, macos-app]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # The release notes are the CHANGELOG section for this version,
      # verbatim. Generated notes would restate the commit subjects the
      # section already explains in prose.
      - name: Extract the CHANGELOG section for this tag
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v want="## [$version]" '
            index($0, want) == 1 { inside = 1; next }
            inside && /^## \[/    { exit }
            inside                { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no CHANGELOG entries under '## [$version]'" >&2
            exit 1
          fi
          echo "bytes=$(wc -c < notes.md)" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release edit "$tag" --draft=false --notes-file notes.md
          echo "::notice::published $tag (${{ steps.notes.outputs.bytes }} bytes of notes)"

  # Sync the Homebrew formula to what was just published.
  #
  # Called, not triggered. `tap-bump` also listens for `release: published`,
  # but GitHub does not start workflows from events raised with the automatic
  # `GITHUB_TOKEN` — so the publish above, performed by this workflow, is
  # invisible to that trigger. v0.8.38 shipped that way: published on its own,
  # with the tap left a version behind and no failure anywhere to say so.
  tap:
    name: bump homebrew tap
    needs: [publish]
    if: github.event_name == 'push'
    uses: ./.github/workflows/tap-bump.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
