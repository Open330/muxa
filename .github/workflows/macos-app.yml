name: macOS app

# The release builds Tend for Mac with the runner's Xcode, which can be older
# than the one on a developer's Mac and stricter about Sendable. Build and test
# the app on every pull request that touches it, so a release is never the
# first place it compiles.
on:
  push:
    branches: [main]
    paths:
      - "apps/tend-macos/**"
      - ".github/workflows/macos-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/tend-macos/**"
      - ".github/workflows/macos-app.yml"
  # Run on main by hand to seed the shared libghostty and Rust caches.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: build and test
    # Keep in step with the release's macOS app job.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # AppIcon.icon (Icon Composer) needs Xcode 26 or newer. The runner's
      # default Xcode can be older: it then copies the icon as a plain folder
      # and the app ships without one (v0.10.12). Pick the newest Xcode 26+.
      - name: Select Xcode 26 or newer
        run: |
          set -euo pipefail
          best=""; bestv=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null || echo 0)
            [ "${v%%.*}" -ge 26 ] 2>/dev/null || continue
            if [ -z "$bestv" ] || [ "$(printf '%s\n%s\n' "$bestv" "$v" | sort -V | tail -1)" = "$v" ]; then
              best="$app"; bestv="$v"
            fi
          done
          if [ -z "$best" ]; then
            ls -d /Applications/Xcode*.app || true
            echo "::error::no Xcode 26 or newer on this runner; AppIcon.icon needs it"
            exit 1
          fi
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # Only main's cache is visible to other refs; a PR or tag copy is
          # half a gigabyte that crowds out the shared ones.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install xcodegen
        run: brew install xcodegen

      # Restore and save are separate so a build that fails later still
      # leaves its libghostty behind, and only main writes the shared copy
      # (a cache saved from a PR or tag is invisible to every other ref).
      - name: Restore libghostty
        id: libghostty
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/tend-macos/.build/dependencies
            apps/tend-macos/.build/toolchains
            apps/tend-macos/.build/libghostty.stamp
          key: libghostty-${{ runner.os }}-${{ hashFiles('apps/tend-macos/Dependencies.lock', 'apps/tend-macos/Patches/libghostty-spm/*.patch') }}

      - name: Build libghostty and generate the project
        working-directory: apps/tend-macos
        run: |
          Scripts/build-libghostty.sh
          xcodegen generate

      - name: Save libghostty
        if: steps.libghostty.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/tend-macos/.build/dependencies
            apps/tend-macos/.build/toolchains
            apps/tend-macos/.build/libghostty.stamp
          key: ${{ steps.libghostty.outputs.cache-primary-key }}

      - name: Test AFM workspace grounding
        run: bash apps/tend-macos/Scripts/test-ask-helper.sh

      - name: Build and run TendTests
        working-directory: apps/tend-macos
        run: |
          set -o pipefail
          xcodebuild \
            -project Tend.xcodeproj \
            -scheme Tend \
            -configuration Debug \
            -derivedDataPath .build/DerivedData \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test > "$RUNNER_TEMP/xcodebuild.log" 2>&1 && status=0 || status=$?
          grep -E ': (error|warning): |Test Case .* failed|Executed [0-9]+ test|Test run with .* (passed|failed)|\*\* (TEST|BUILD) ' \
            "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -200 || true
          exit "$status"

      # The release builds the Release configuration (whole-module), whose
      # actor-isolation checking is stricter than Debug's: v0.8.57 passed
      # this job and still failed the release. Compile it here too, for
      # arm64 only: the check is the same per architecture, and the x86_64
      # slice would rebuild the Rust helpers a second time.
      - name: Build the Release configuration
        working-directory: apps/tend-macos
        run: |
          set -o pipefail
          xcodebuild \
            -project Tend.xcodeproj \
            -scheme Tend \
            -configuration Release \
            -derivedDataPath .build/DerivedDataRelease \
            -destination 'platform=macOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/xcodebuild-release.log" 2>&1 && status=0 || status=$?
          grep -E ': (error|warning): |\*\* BUILD ' "$RUNNER_TEMP/xcodebuild-release.log" | sort -u | head -200 || true
          exit "$status"
      # An Xcode that cannot compile AppIcon.icon still builds, but the app
      # has no icon. The release would ship it that way, so check here.
      - name: Check the app icon
        working-directory: apps/tend-macos
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" \
            .build/DerivedDataRelease/Build/Products/Release/Tend.app/Contents/Info.plist
      # The build extracts every new string into the catalog; one without a
      # Korean value means a translation was forgotten.
      - name: Check translations
        working-directory: apps/tend-macos
        run: python3 Scripts/l10n-sync.py --check

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
