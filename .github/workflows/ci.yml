name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved from main only: every PR push saving its own ~300 MB copy
          # per job filled the 10 GB repository cache and evicted the
          # libghostty and macOS caches the release depends on. PRs restore
          # main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The workspace run unifies features, so tend is always built with
      # `dashboard` there. This builds the CLI side the way `cargo install
      # --path crates/tend-cli` does, without the dashboard server.
      - run: cargo clippy -p tend -p tend-cli --all-targets -- -D warnings
      # The account module (`tend-aas`) is optional: tend and tendd must also
      # build, lint clean and answer "not in this build" without it.
      - run: cargo clippy -p tend-cli -p tendd --no-default-features --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `window_placement` drives a private tmux server; without tmux the test
      # skips itself and the regression it guards goes unwatched here.
      - run: sudo apt-get update && sudo apt-get install -y tmux
      # e2e tests shell out to `tendd` / `tend` — those bins live in other
      # workspace packages and cargo test won't build them otherwise.
      - run: cargo build --workspace --bins
      - run: cargo test --workspace

  js-test:
    name: dashboard JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # The dashboard's pure modules (pane drawer, live-output stream,
      # topology, work and collaboration models) are plain ES modules tested
      # with node's built-in runner. `node --test <directory>` does not find
      # these files, so name them with a glob; the job fails if any test does.
      - run: node --test crates/tend/tests-js/*.test.mjs

  onboarding-script:
    name: onboarding script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck scripts/onboard.sh

  sandbox:
    name: sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved from main only: every PR push saving its own ~300 MB copy
          # per job filled the 10 GB repository cache and evicted the
          # libghostty and macOS caches the release depends on. PRs restore
          # main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: cargo build --workspace --bins
      - run: shellcheck scripts/tend-sandbox.sh scripts/sandbox-smoke.sh
      # A sandbox that leaks a daemon or a tmux server is worse than no
      # sandbox, so the suite asserts teardown is total from every state.
      - run: scripts/sandbox-smoke.sh
      # A sandbox that reads the caller's ~/.tmux.conf is not a sandbox: their
      # hooks run inside it, and tend's own `tmux-auto-view` detaches the
      # learner the moment they attach.
      - run: python3 scripts/config-isolation-check.py

  live-tour:
    name: live tour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved from main only: every PR push saving its own ~300 MB copy
          # per job filled the 10 GB repository cache and evicted the
          # libghostty and macOS caches the release depends on. PRs restore
          # main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: cargo build --workspace --bins
      # The tour claims it never intercepts a keystroke, so every step has to be
      # reachable by typing the command the narration asks for. This types them.
      - run: scripts/live-tour-smoke.py --tend target/debug/tend
      - run: scripts/live-tour-smoke.py --tend target/debug/tend --lang ko
      # Issue #76 was a gate with no way around it; this is the check that
      # the live tour cannot repeat that.
      - run: scripts/live-tour-smoke.py --tend target/debug/tend --mode skip
      # `exit` closes the last pane, and with it the sandbox server the tour is
      # polling. That is a way out, not a crash.
      - run: python3 scripts/exit-check.py --tend target/debug/tend

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved from main only: every PR push saving its own ~300 MB copy
          # per job filled the 10 GB repository cache and evicted the
          # libghostty and macOS caches the release depends on. PRs restore
          # main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
