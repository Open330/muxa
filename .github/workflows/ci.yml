name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # e2e tests shell out to `muxad` / `muxa` — those bins live in other
      # workspace packages and cargo test won't build them otherwise.
      - run: cargo build --workspace --bins
      - run: cargo test --workspace

  onboarding-parity:
    name: onboarding parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p muxa-cli --bin muxa
      - run: shellcheck scripts/onboard.sh
      # The shell fallback in onboard.sh must teach the same keys as the real
      # tour; `muxa onboard --emit step-table` is the contract it is held to.
      - run: python3 scripts/onboarding-parity.py --muxa target/debug/muxa
      - run: python3 scripts/onboarding-parity.py --muxa target/debug/muxa --lang ko
      # Step 6 accepts an arrow and nothing else, so an arrow the terminal
      # tears in two has to survive the split-escape handler.
      - run: python3 scripts/split-arrow-check.py --muxa target/debug/muxa

  sandbox:
    name: sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: cargo build --workspace --bins
      - run: shellcheck scripts/muxa-sandbox.sh scripts/sandbox-smoke.sh
      # A sandbox that leaks a daemon or a tmux server is worse than no
      # sandbox, so the suite asserts teardown is total from every state.
      - run: scripts/sandbox-smoke.sh

  live-tour:
    name: live tour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: cargo build --workspace --bins
      # The tour claims it never intercepts a keystroke, so every step has to be
      # reachable by typing the command the narration asks for. This types them.
      - run: scripts/live-tour-smoke.py --muxa target/debug/muxa
      - run: scripts/live-tour-smoke.py --muxa target/debug/muxa --lang ko
      # Issue #76 was a gate with no way around it; this is the check that
      # the live tour cannot repeat that.
      - run: scripts/live-tour-smoke.py --muxa target/debug/muxa --mode skip
      # `exit` closes the last pane, and with it the sandbox server the tour is
      # polling. That is a way out, not a crash.
      - run: python3 scripts/exit-check.py --muxa target/debug/muxa

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
