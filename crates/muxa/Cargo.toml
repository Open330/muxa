[package]
name = "muxa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "observability for AI coding agents in tmux."

[features]
# A swap service over an inert engine, for daemon tests. Never in a release.
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
strum = { workspace = true }
subtle = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
rust-embed = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
# `ask_provider_configure` edits `[ask.providers.<id>]` in place, keeping
# the operator's comments and ordering, the same way the CLI's work
# editors do.
toml_edit = "0.22"
notify-rust = "4"
portable-pty = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
base64 = { workspace = true }
sha2 = "0.10"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Windows has neither `/proc` nor `ps`; sysinfo reads the process table
# (pid, parent, argv) through safe bindings, so `unsafe_code` stays forbidden.
# macOS reads a process's environment through it too: `ps eww` joins it with
# spaces, which cuts values under `~/Library/Application Support`.
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
tempfile = "3"
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
tracing-subscriber = { workspace = true }

[[bench]]
name = "store_apply"
harness = false

[[bench]]
name = "runtime_reads"
harness = false

[lints]
workspace = true
