[package]
name = "tend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "observability for AI coding agents in tmux."

[features]
# The web dashboard's HTTP server and embedded assets. tendd enables it; the
# `tend` CLI, which every hook spawns, builds without it.
dashboard = [
    "dep:axum",
    "dep:tower-http",
    "dep:futures",
    "dep:tokio-stream",
    "dep:rust-embed",
    "dep:openidconnect",
]

[dependencies]
# `O_NONBLOCK`/`O_NOFOLLOW` for reading a file another process holds open
# without waiting on a FIFO at its name (constants only; no unsafe code).
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
strum = { workspace = true }
subtle = { workspace = true }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true }
reqwest = { workspace = true }
url = { workspace = true }
# `ask_provider_configure` edits `[ask.providers.<id>]` in place, keeping
# the operator's comments and ordering, the same way the CLI's work
# editors do.
toml_edit = "0.22"
notify-rust = "4"
portable-pty = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
base64 = { workspace = true }
sha2 = "0.10"
# Operator sign-in and viewer accounts for a published dashboard.
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"], optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Windows has neither `/proc` nor `ps`; sysinfo reads the process table
# (pid, parent, argv) through safe bindings, so `unsafe_code` stays forbidden.
# macOS reads a process's environment through it too: `ps eww` joins it with
# spaces, which cuts values under `~/Library/Application Support`.
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }

[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
# `kill(pid, 0)` answering ESRCH is the authoritative "this pid is gone" on
# macOS, which has no `/proc`. Without it a worker whose pane closed can never
# be proven exited, so its launch holds room capacity forever.
nix = { version = "0.29", features = ["signal", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The account's own uid and passwd home, safely, to tell the user's daemon
# from one started with its own HOME or XDG directories (`paths`).
nix = { version = "0.29", features = ["user"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
tempfile = "3"
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
tracing-subscriber = { workspace = true }

[[bench]]
name = "store_apply"
harness = false

[[bench]]
name = "runtime_reads"
harness = false

[lints]
workspace = true
