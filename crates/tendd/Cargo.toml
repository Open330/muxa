[package]
name = "tendd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "tend daemon"

[[bin]]
name = "tendd"
path = "src/main.rs"

[features]
# The account module (`tend-aas`): `tend swap`, the `swap_account`
# automation action, `tend_swap_account` and `[agent.<program>].account`
# launches. On by default so every release path (`scripts/release-local.sh`,
# `release.yml`, `embed-tendd.sh`, `install.sh`) ships it; whether it is used
# is `[modules] accounts` in config.toml. `--no-default-features` builds
# without it.
default = ["aas"]
aas = ["dep:tend-aas"]

[dependencies]
# The optional account module; see the `aas` feature.
tend-aas = { workspace = true, optional = true }
tend = { workspace = true, features = ["dashboard"] }

anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tend-aas = { workspace = true, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
