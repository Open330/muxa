[package]
name = "tendd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "tend daemon"

[[bin]]
name = "tendd"
path = "src/main.rs"

[dependencies]
tend = { workspace = true, features = ["dashboard"] }

anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tend = { workspace = true, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
