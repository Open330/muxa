[package]
name = "tend-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "tend CLI"

[[bin]]
name = "tend"
path = "src/main.rs"

[features]
# The account module (`tend-aas`): `tend swap`, the `swap_account`
# automation action, `tend_swap_account` and `[agent.<program>].account`
# launches. On by default so every release path (`scripts/release-local.sh`,
# `release.yml`, `embed-tendd.sh`, `install.sh`) ships it; whether it is used
# is `[modules] accounts` in config.toml. `--no-default-features` builds
# without it.
default = ["aas"]
aas = ["dep:tend-aas", "tend-work/aas"]

[dependencies]
uuid.workspace = true
tend = { workspace = true }
tend-work = { workspace = true }
# The optional account module; see the `aas` feature.
tend-aas = { workspace = true, optional = true }

anyhow = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
# `io-std` (on top of the workspace feature set) gives `tend mcp` async
# stdin/stdout for its JSON-RPC stdio loop.
tokio = { workspace = true, features = ["io-std"] }
sha2 = "0.10"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# `tend status` table + colors.
# NOTE: keep default features ON — they include `custom_styling`, which
# makes comfy-table recognize ANSI escape sequences as zero-width. Disabling
# them broke alignment on rows where cells contained owo-colors wrappers
# (the escapes were counted as visible chars).
comfy-table = "7"
owo-colors = { version = "4", features = ["supports-colors"] }

# TUI — `tend watch`.
ratatui = "0.30"
crossterm = "0.29"
# Parses ANSI escape sequences (colors / attributes) from tmux's
# `capture-pane -e` output into ratatui `Text`/`Lines`, so the live pane
# preview keeps the source pane's coloring.
ansi-to-tui = "8"

# `tend init` interactive wizard.
# cliclack is the Rust port of clack.cc — gives us the modern boxed-flow
# look (◇ ✔ ⚠ glyphs, multi-select, spinners) without rolling our own.
cliclack = "0.3"
console = "0.15"
# Locate cargo / tmux / claude / codex / agy binaries on PATH for
# pre-flight detection.
which = "7"
# Round-trip TOML edits that preserve user formatting + comments — used
# by codex hook merger and dashboard token writer. Plain `toml` would
# rewrite the whole file from scratch.
toml_edit = "0.22"
toml = { workspace = true }
reqwest = { workspace = true }
# Width-aware truncation for human CLI tables; important for CJK prompts.
unicode-width = "0.2"
# Cryptographically-strong dashboard tokens via the OS RNG.
rand = "0.8"

# Signal forwarding for interactive tmux/ssh attach children, so the
# `--fit` restore guards run when the surrounding PTY hangs up. Both are
# already in the dependency graph; they only add safe wrappers here. Unix
# only: nothing uses them on Windows.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
nix = { version = "0.29", features = ["signal"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
# `tend reload` reads each pane's argv with its argument boundaries (macOS
# `ps` only reports them joined) and when the agent in it started. Linux
# reads both from `/proc`.
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }

[dev-dependencies]
# Test builds never write worktree receipts into the user's data directory
# (see tend-work's `test-no-receipts`).
tend-work = { workspace = true, features = ["test-no-receipts"] }
tempfile = "3"
# `test-util` enables `tokio::time::pause`/`advance`, which the watch
# refresh-task tests use to drive the periodic tick deterministically
# without sleeping the test runner.
tokio = { workspace = true, features = ["test-util"] }
# Snapshot tests for the `tend watch` TUI — pinned to the visual buffer
# string so render regressions get caught beyond "did not panic".
insta = { version = "1", features = ["yaml"] }

[lints]
workspace = true
