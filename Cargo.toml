[workspace]
resolver = "2"
members = ["crates/muxa", "crates/muxa-cli", "crates/muxad"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Open330/muxa"
authors = ["Open330 Contributors"]

[workspace.dependencies]
# internal
muxa = { path = "crates/muxa", version = "0.3.0" }

# external
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "fs", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
strum = { version = "0.27", features = ["derive"] }
subtle = "2"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
rust-embed = "8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
