[workspace]
resolver = "2"
members = ["crates/tend", "crates/tend-cli", "crates/tendd", "crates/tend-zellij-plugin"]

[workspace.package]
version = "0.10.9"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Open330/tend"
authors = ["Open330 Contributors"]

[workspace.dependencies]
# internal
tend = { path = "crates/tend", version = "0.10.9" }

# external
anyhow = "1.0.103"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "fs", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros", "local-offset"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
strum = { version = "0.27", features = ["derive"] }
subtle = "2"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
rust-embed = "8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
base64 = "0.22"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
# Rust 1.99 pedantic; `assert!(x.is_empty())` is the house style in tests.
assert_is_empty = "allow"

# Full debuginfo for every crate made `target/debug` the bulk of the target
# directory, and each rebuild of a test binary keeps another copy. Line tables
# keep panics and backtraces readable; set `CARGO_PROFILE_DEV_DEBUG=full` for a
# debugger session.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
