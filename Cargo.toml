[package]
name = "muxa"
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
description = "Agent CLI observability & orchestration layer for tmux"
license = "MIT"
publish = false

[[bin]]
name = "muxad"
path = "src/bin/muxad.rs"

[[bin]]
name = "muxa"
path = "src/bin/muxa.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
