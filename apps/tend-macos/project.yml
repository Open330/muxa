name: Tend

options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  # English is the development language; Korean lives in
  # Resources/Localizable.xcstrings (xcodegen derives knownRegions from it).
  developmentLanguage: en

packages:
  GhosttyKit:
    path: .build/dependencies/libghostty-spm

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CLANG_ENABLE_MODULES: YES

targets:
  Tend:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: GhosttyKit
        product: GhosttyTerminal
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tend.mac
        PRODUCT_NAME: Tend
        # Merged with the generated Info.plist: exported type declarations.
        INFOPLIST_FILE: AppInfo.plist
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tend
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        # Localization: the compiler records every SwiftUI/String(localized:)
        # literal so `xcodebuild -exportLocalizations` and Scripts/l10n-sync.py
        # can keep Resources/Localizable.xcstrings complete.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    postBuildScripts:
      - name: Embed tend runtime
        script: '"$SRCROOT/Scripts/embed-tendd.sh"'
        basedOnDependencyAnalysis: false
      # tend-afm, the bridge tendd's `apple` Ask engine spawns. Its own
      # script so TEND_SKIP_EMBED can skip the Rust rebuild without
      # skipping a helper that compiles in a second.
      - name: Embed Ask helper
        script: '"$SRCROOT/Scripts/embed-ask-helper.sh"'
        basedOnDependencyAnalysis: false

  TendTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Tend
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.tend.mac.tests

  TendQAHelper:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: HelperSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tend.qa-helper
        PRODUCT_NAME: TendQAHelper
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tend QA Helper
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: Tend QA Helper captures only the Tend window for local UI verification.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  Tend:
    build:
      targets:
        Tend: all
        TendTests: [test]
    test:
      targets:
        - TendTests
      # The test host follows the machine's language list; pin it to English
      # so assertions on UI wording do not depend on the developer's macOS.
      commandLineArguments:
        "-AppleLanguages (en)": true
  TendQAHelper:
    build:
      targets:
        TendQAHelper: all
